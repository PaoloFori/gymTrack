      case "up-es": case "down-es":

      case "toggle-w": var tw = session.ex[d.e].sets[d.s]; tw.w = !tw.w; saveSess(); render(); break;

      case "mail-step": S.attrezzi = S.attrezzi || []; sheet.step = "mail"; render(); break;
      case "mail-back": sheet.step = ""; render(); break;
      case "copy-mail": try { navigator.clipboard.writeText(mailText()).then(function () { toast("Testo copiato"); }, function () { toast("Seleziona il testo e copialo a mano"); }); } catch (e) { toast("Seleziona il testo e copialo a mano"); } break;
      case "share-mail": try { if (navigator.share) navigator.share({ title: "Richiesta scheda di allenamento", text: mailText() }).catch(function () {}); else toast("Condivisione non disponibile: usa Copia testo"); } catch (e) { toast("Usa Copia testo"); } break;
      case "new-ai": sheet = { kind: "ai", note: "", prompt: "", paste: "", min: (cur && cur.minuti) || 60, step: "", mail: undefined }; render(); if (!aiFn && CLOUD) initCloudAi(); break;
      case "eq-all": S.attrezzi = S.attrezzi.filter(function (n) { return EQ[d.g].indexOf(n) < 0; }).concat(EQ[d.g]); saveApp(); render(); break;

      case "gen-ai": genAI(); break;

      case "copy-prompt":

      case "cal-next": if (calM < 0) { calM++; calSel = null; render(); } break;

        if (!confirmed("ar" + d.k)) return;

  function processPhoto(file) {
    if (!file) return;
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var sz = Math.min(img.width, img.height), cv = document.createElement("canvas"); cv.width = cv.height = 192;
        cv.getContext("2d").drawImage(img, (img.width - sz) / 2, (img.height - sz) / 2, sz, sz, 0, 0, 192, 192);
        S.profile.foto = cv.toDataURL("image/jpeg", 0.8); saveApp(); render();
      };
      img.onerror = function () { toast("Immagine non valida"); };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  }
